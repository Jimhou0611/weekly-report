<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>行銷組工作週報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: header, selected week's key tasks, then a month calendar where the selected week row opens large and other weeks stay compact */
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--ink:#17222E;--muted:#5D6B79;--faint:#9AA6B2;--line:#DCE2E8;--soft:#F7F9FB;
  --accent:#1E4E79;--accent-soft:#E3ECF5;
  --done:#2D7A4F;--done-soft:#E2F2E8;--wip:#A66508;--wip-soft:#FBEFD9;--danger:#B3372F;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171D;--surface:#19222B;--ink:#E6ECF1;--muted:#93A2B0;--faint:#5F6E7C;--line:#2B3743;--soft:#151C23;
  --accent:#7FB2E0;--accent-soft:#1F3347;
  --done:#6CCB93;--done-soft:#183526;--wip:#E8B064;--wip-soft:#3A2C14;--danger:#F08A80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171D;--surface:#19222B;--ink:#E6ECF1;--muted:#93A2B0;--faint:#5F6E7C;--line:#2B3743;--soft:#151C23;
  --accent:#7FB2E0;--accent-soft:#1F3347;
  --done:#6CCB93;--done-soft:#183526;--wip:#E8B064;--wip-soft:#3A2C14;--danger:#F08A80;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 96px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--f-display);font-size:28px;line-height:1.25;margin:2px 0 0;text-wrap:balance}
.meta{font-size:13px;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.icon{padding:4px 10px;font-size:16px;line-height:1.2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .range{font-family:var(--f-num);font-weight:500;font-size:14px;color:var(--muted)}
.chip{font-size:11px;font-weight:500;background:var(--accent);color:var(--surface);border-radius:4px;padding:1px 6px;line-height:1.5}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.goal{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1.2fr);gap:12px 16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .t{font-weight:500}
.goal .n{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.wip{background:var(--wip-soft);color:var(--wip)}
.tag{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.empty{font-size:13px;color:var(--muted)}
/* calendar */
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-family:var(--f-num);font-weight:500;font-size:15px;min-width:96px;text-align:center}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line);letter-spacing:.08em}
.dow div:nth-child(n+6){color:var(--danger)}
.wk{border-top:1px solid var(--line)}
.dow + .wk{border-top:0}
.cell{min-width:0;border-left:1px solid var(--line);padding:6px 8px}
.cell:first-child{border-left:0}
.dn{font-family:var(--f-num);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.wk.mini .cell.out,.wk.none .cell.out{background:color-mix(in srgb,var(--line) 35%,transparent)}
.today .dn b{background:var(--accent);color:var(--surface);border-radius:4px;padding:0 5px}
.dn b{font-weight:500}
.mo{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--accent)}
/* compact week */
.wk.mini{cursor:pointer;background:var(--soft)}
.wk.mini:hover{background:var(--accent-soft)}
.wk.mini .cell{height:74px;overflow:hidden}
.mini-t{font-size:12px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mini-t.d{color:var(--muted)}
.mini-t i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:5px;vertical-align:1px}
.mini-t.d i{background:var(--done)}
.more{font-size:11px;color:var(--muted)}
.wk.none{cursor:default;background:var(--soft)}
.wk.none .cell{height:44px}
.wk.none.can{cursor:pointer}
.wk.none.can:hover{background:var(--accent-soft)}
.wk.none .hint{display:none}
.wk.none.can:hover .hint{display:inline}
.hint{font-size:11px;color:var(--accent)}
/* open week */
.band{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--accent-soft);border-top:1px solid var(--line);font-size:13px}
.dow + .band{border-top:0}
.band .r{font-family:var(--f-num);font-weight:500;color:var(--accent)}
.wk.open{border-top:0}
.wk.open .cell{min-height:200px;padding:10px;display:flex;flex-direction:column;gap:8px}
.wk.open .cell.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.wd{display:none}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.tasks li{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;line-height:1.5;min-width:0}
ul.tasks li span{overflow-wrap:anywhere}
.ck{flex:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);margin-top:3px;display:inline-flex;align-items:center;justify-content:center}
.ck.on{background:var(--done);border-color:var(--done)}
.ck.on::after{content:"";width:4px;height:7px;border:solid var(--surface);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-.5px,-1px)}
li.is-done span{color:var(--muted)}
/* edit mode */
.erow{display:flex;gap:6px;align-items:center;min-width:0}
.erow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:4px 7px;font-size:13.5px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--done);flex:none;margin:0}
.goal.edit{grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr) auto}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:2px 4px;border-radius:4px;flex:none}
.x:hover{color:var(--danger)}
.add{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:8px;padding:3px 9px;font-size:12.5px;color:var(--accent);cursor:pointer}
.goals .add{margin:10px 18px 14px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.msg{font-size:14px}
.msg.err{color:var(--danger)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reporter{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pwin{width:150px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 10px;font-size:14px}
.reporter input{width:120px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:3px 8px}
@media (max-width:720px){
  h1{font-size:23px}
  .goal{grid-template-columns:auto minmax(0,1fr);padding:12px 14px}
  .goal .n{grid-column:2}
  .goal.edit{grid-template-columns:auto minmax(0,1fr) auto}
  .goal.edit .n{grid-column:2 / 3}
  .cell{padding:5px 4px}
  .wk.mini .cell{height:52px}
  .mini-t{font-size:0;line-height:0;display:inline-block;margin-right:2px}
  .mini-t i{margin:0}
  .more{display:none}
  .dn{font-size:11px;justify-content:center}
  .wk.open{grid-template-columns:1fr}
  .wk.open .cell{min-height:0;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:72px minmax(0,1fr);align-items:start;gap:8px;padding:10px 12px}
  .wk.open .cell:first-child{border-top:0}
  .wk.open .dn{justify-content:flex-start;font-size:12px}
  .wk.open .wd{display:inline;font-family:var(--f-body);color:var(--ink);font-weight:500}
  .wk.open .body{display:flex;flex-direction:column;gap:6px;min-width:0}
}
.body{display:flex;flex-direction:column;gap:6px;min-width:0}

/* day status + roomy editing */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;min-width:0}
.st{font-size:11px;font-weight:500;border-radius:4px;padding:0 6px;line-height:1.7;white-space:nowrap}
.st-leave{background:var(--wip-soft);color:var(--wip)}
.st-off{background:var(--line);color:var(--muted)}
.cell.is-leave{background:color-mix(in srgb,var(--wip-soft) 55%,var(--surface))}
.cell.is-off{background:var(--soft)}
.wk.mini .cell.is-leave{background:color-mix(in srgb,var(--wip-soft) 70%,var(--soft))}
.stsel{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:2px 6px}
textarea.grow{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:5px 8px;font:inherit;font-size:14px;line-height:1.55;resize:none;overflow:hidden;display:block;box-sizing:border-box}
.erow{align-items:flex-start}
.erow input[type=checkbox]{margin-top:7px}
.erow .x{margin-top:3px}
ul.tasks li span,.goal .t,.goal .n{white-space:pre-wrap}
.wk.open.list{grid-template-columns:1fr}
.wk.open.list .cell{min-height:0;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;padding:12px 16px;align-items:start}
.wk.open.list .cell:first-child{border-top:0}
.wk.open.list .dhead{flex-direction:column;align-items:flex-start;gap:6px}
.wk.open.list .dn{justify-content:flex-start;font-size:13px}
.wk.open.list .wd{display:inline;font-family:var(--f-body);color:var(--ink);font-weight:500}
@media (max-width:720px){.wk.open.list .cell{grid-template-columns:1fr;gap:8px}.wk.open.list .dhead{flex-direction:row;align-items:center}}
/* tabs */
.tabs-wrap{overflow-x:auto;margin:-4px 0;padding:4px 0}
.tabs{display:flex;gap:8px;width:max-content;min-width:100%}
.tab{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.tab.add-tab{border-style:dashed;color:var(--accent);background:transparent}
/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:16px}
.panel p{margin:0;font-size:14px;color:var(--muted)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.danger-row{border-top:1px solid var(--line);padding-top:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input{font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;min-width:0}
.monthnav b{min-width:0}
/* overview */
.ov-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ov{min-width:920px}
.ov-row{display:grid;grid-template-columns:170px repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.ov-row:first-child{border-top:0}
.ov-head{font-size:12px;color:var(--muted)}
.ov-head>div{padding:8px 10px;letter-spacing:.04em}
.ov-hd span{font-family:var(--f-num)}
.ov-hd.today{color:var(--accent);font-weight:700}
.ov-name{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ov-link{font:inherit;font-weight:700;font-size:15px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left}
.ov-link:hover{text-decoration:underline}
.ov-goals,.ov-tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ov-goals li,.ov-tasks li{font-size:12.5px;line-height:1.45;display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.ov-goals li{color:var(--muted)}
.ov-goals i,.ov-tasks i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:6px}
.ov-goals li.d i,.ov-tasks li.d i{background:var(--done)}
.ov-tasks li.d{color:var(--muted)}
.ov-cell{border-left:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ov-cell.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.ov-cell.is-leave{background:color-mix(in srgb,var(--wip-soft) 55%,var(--surface))}
.ov-cell.is-off{background:var(--soft)}
.ov-dl{display:none;align-items:center;gap:6px}
.ov-cell .ov-dl{display:flex;justify-content:flex-end}
.ov-cell .ov-dl .wd{display:none}
.ov-none{grid-column:2 / -1;border-left:1px solid var(--line);padding:12px;font-size:13px;color:var(--muted);display:flex;align-items:center}
.wk.none.cur{background:var(--accent-soft)}
@media (max-width:720px){
  .ov-scroll{overflow:visible;background:transparent;border:0;border-radius:0}
  .ov{min-width:0;display:flex;flex-direction:column;gap:12px}
  .ov-head{display:none}
  .ov-row{grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ov-cell{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:8px 12px}
  .ov-cell.blank{display:none}
  .ov-cell .ov-dl{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px}
  .ov-cell .ov-dl .wd{display:inline;font-size:12.5px;color:var(--ink);font-weight:500}
  .ov-none{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
// ★ Google Apps Script 的網址（資料存放處）。如果之後重新「新增部署作業」產生了新網址，換掉這一行即可。
var API_URL='https://script.google.com/macros/s/AKfycbyyXW4rkEVsuWVrJOSne2Z056RUrSXd0sT-LwP1GgnqEJrxTR1ZwHKs9-zR2h6yQOj0BA/exec';

var DAYS=[['mon','週一',0],['tue','週二',1],['wed','週三',2],['thu','週四',3],['fri','週五',4],['sat','週六',5],['sun','週日',6]];
var ST={work:'上班',leave:'請假',off:'休假'};
var members=[],data={},versions={},snap={};
var loaded=false,editing=false,busy=false,msg='',msgErr=false,confirmDel=false;
var view='all';               // 'all' 或成員 id
var panel=null;               // 'login' | 'join' | 'settings' | null
var pwErr='',pwBusy=false,formErr='',formBusy=false,confirmRemove=false;
var app=document.getElementById('app');

function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function md(d){return (d.getMonth()+1)+'/'+d.getDate();}
function label(w){var s=pd(w.start);return md(s)+' – '+md(add(s,6));}
function uid(){return Math.random().toString(36).slice(2,9);}
function mondayOf(d){return add(d,-((d.getDay()+6)%7));}
var today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
var thisMonday=iso(mondayOf(today));
var curStart=thisMonday;

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
var creds={};try{creds=JSON.parse(ls('wr-creds')||'{}')||{};}catch(e){creds={};}
var adminPw=ls('wr-admin')||null;
function saveCreds(){ls('wr-creds',JSON.stringify(creds));}
function pwFor(mid){return creds[mid]||adminPw;}
function canEdit(mid){return !!pwFor(mid);}

function member(id){return members.filter(function(m){return m.id===id;})[0];}
function weeksOf(mid){return (data[mid]||(data[mid]={weeks:[]})).weeks;}
function sortedOf(mid){return weeksOf(mid).slice().sort(function(a,b){return a.start<b.start?-1:1;});}
function findWeek(mid,s){return weeksOf(mid).filter(function(w){return w.start===s;})[0];}
function list(w,k){return w.days[k]||(w.days[k]=[]);}
function normWeek(o){var w={start:o.start,goals:Array.isArray(o.goals)?o.goals:[],days:{}};var d=o.days||{};
  DAYS.forEach(function(x){w.days[x[0]]=Array.isArray(d[x[0]])?d[x[0]]:[];});
  if(o.status&&Object.keys(o.status).length)w.status=o.status;return w;}
function defStatus(k){return (k==='sat'||k==='sun')?'off':'work';}
function dayStatus(w,k){var s=w&&w.status&&w.status[k];return s||defStatus(k);}
function setStatus(w,k,v){w.status=w.status||{};if(v===defStatus(k))delete w.status[k];else w.status[k]=v;if(!Object.keys(w.status).length)delete w.status;}

// ---------- 網址 #成員 ----------
function readHash(){var h=decodeURIComponent((location.hash||'').slice(1));return h||'all';}
function setHash(v){var t=v==='all'?'':'#'+v;if(location.hash!==t){try{history.replaceState(null,'',location.pathname+location.search+t);}catch(e){location.hash=t;}}}
view=readHash();
window.addEventListener('hashchange',function(){var v=readHash();if(v!==view)go(v);});

// ---------- 資料同步 ----------
function load(d){
  members=d.members||[];data={};versions={};snap={};
  members.forEach(function(m){data[m.id]={weeks:[]};});
  (d.rows||[]).forEach(function(r){
    var i=r.key.indexOf('|');if(i<0)return;
    var mid=r.key.slice(0,i),o;try{o=normWeek(JSON.parse(r.json));}catch(e){return;}
    if(!data[mid])return;
    versions[r.key]=r.version;snap[r.key]=JSON.stringify(o);data[mid].weeks.push(o);
  });
  if(!member(view)){var last=ls('wr-view');view=member(last)?last:(members[0]?members[0].id:'all');setHash(view);}

function changes(){

    });
  });
  Object.keys(snap).forEach(function(k){if(!seen[k])out.push({key:k,json:null,baseVersion:versions[k]||0});});
  return out;
}
function dirty(){return loaded&&changes().length>0;}
function api(body,ok,fail){

              :fetch(API_URL+'?api=1&t='+Date.now(),{credentials:'omit',cache:'no-store'});
  req.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
     .then(function(res){if(res&&res.error==='bad_request')throw new Error(res.error);ok(res);})
     .catch(function(e){(fail||function(){})(e);});
}

          h('button',{cls:'x','aria-label':'刪除此項',onclick:function(){l.splice(i,1);render();},text:'×'})]));
      });
      body.appendChild(h('button',{cls:'add',id:'add-'+d[0],onclick:function(){var id=uid();l.push({id:id,text:'',done:false});render();var el=document.getElementById('dt-'+id);if(el)el.focus();},text:'＋ 新增'}));
    }else if(l.length){
      body.appendChild(h('ul',{cls:'tasks'},l.map(function(t){return h('li',{cls:t.done?'is-done':null},[h('i',{cls:'ck'+(t.done?' on':''),'aria-label':t.done?'已完成':'進行中'}),h('span',{text:t.text})]);})));
    }
    row.appendChild(dateCell(date,st!=='work'?'is-'+st:null,[h('div',{cls:'dhead'},[dn(date,d[1]),stEl]),body]));
  });
  cal.appendChild(row);
}

function emptyDays(){var o={};DAYS.forEach(function(d){o[d[0]]=[];});return o;}
function createWeek(mid,start,silent){
  if(findWeek(mid,start)){if(!silent)selectWeek(start);return;}
  var prev=sortedOf(mid).filter(function(w){return w.start<start;}).pop();
  var goals=prev?prev.goals.filter(function(g){return !g.done&&(g.text||'').trim();}).map(function(g){return {id:uid(),text:g.text,note:g.note||'',done:false,carried:true};}):[];
  weeksOf(mid).push({start:start,goals:goals,days:emptyDays()});
  curStart=start;confirmDel=false;if(!silent)render();
}
function delWeek(mid){
  data[mid].weeks=weeksOf(mid).filter(function(w){return w.start!==curStart;});
  confirmDel=false;render();
}

// ---------- 儲存 ----------
var barEl=null;
function bar(){
  var d=dirty(),show=d||msg;
  if(!show){if(barEl){barEl.remove();barEl=null;}return;}
  if(barEl)barEl.remove();
  barEl=h('div',{cls:'savebar',role:'status'},[h('div',{cls:'in'},[
    h('span',{cls:'msg'+(msgErr?' err':''),text:msg||(d?'有尚未儲存的變更，儲存後大家打開網址就會看到最新內容。':'')}),
    d?h('div',{cls:'toolbar'},[
      h('button',{cls:'btn ghost',id:'discard',disabled:busy||null,onclick:discard,text:'捨棄變更'}),
      h('button',{cls:'btn primary',id:'save',disabled:busy||null,onclick:save,text:busy?'儲存中…':'儲存並更新'})
    ]):(msg?h('button',{cls:'x',onclick:function(){msg='';bar();},'aria-label':'關閉',text:'×'}):null)])]);
  document.body.appendChild(barEl);
}
function discard(){
  members.forEach(function(m){data[m.id].weeks=[];});
  Object.keys(snap).forEach(function(k){var i=k.indexOf('|'),mid=k.slice(0,i);if(data[mid])data[mid].weeks.push(JSON.parse(snap[k]));});
  msg='';confirmDel=false;render();
}
function clean(){
  members.forEach(function(m){weeksOf(m.id).forEach(function(w){
    w.goals=w.goals.filter(function(g){return (g.text||'').trim()||(g.note||'').trim();});
    DAYS.forEach(function(d){w.days[d[0]]=(w.days[d[0]]||[]).filter(function(t){return (t.text||'').trim();});});
  });});
}
function save(){
  if(busy)return;
  clean();
  var ch=changes();if(!ch.length){render();return;}
  var mid=ch[0].key.split('|')[0];
  busy=true;msg='儲存中…';msgErr=false;bar();
  api({action:'save',member:mid,password:pwFor(mid),changes:ch},function(res){
    busy=false;
    if(res.denied){delete creds[mid];saveCreds();if(adminPw){adminPw=null;ls('wr-admin',null);}editing=false;msg='密碼已變更，請重新登入後再儲存。你剛改的內容還在畫面上。';msgErr=true;render();return;}
    if(res.error){msg='儲存失敗（'+res.error+'），請重新整理頁面。';msgErr=true;render();return;}
    load(res.data);
    if(res.ok){msg='已儲存';msgErr=false;setTimeout(function(){if(msg==='已儲存'){msg='';bar();}},2500);}
    else{msg='有人剛剛也改了 '+res.conflicts.map(function(k){return label({start:k.split('|')[1]});}).join('、')+' 這週，已載入最新內容，請再改一次。';msgErr=true;}
    render();
  },function(){busy=false;msg='儲存失敗，請檢查網路後再按一次「儲存並更新」。';msgErr=true;render();});
}
window.addEventListener('resize',function(){app.querySelectorAll('textarea.grow').forEach(grow);});
window.addEventListener('beforeunload',function(e){if(dirty()&&!busy){e.preventDefault();e.returnValue='';}});

render();
fetchAll(true);
setInterval(function(){if(!document.hidden)fetchAll(false);},60000);
})();
</script>
</body>
