<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作週報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: header, selected week's key tasks, then a month calendar where the selected week row opens large and other weeks stay compact */
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--ink:#17222E;--muted:#5D6B79;--faint:#9AA6B2;--line:#DCE2E8;--soft:#F7F9FB;
  --accent:#1E4E79;--accent-soft:#E3ECF5;--rest:#E9ECEF;
  --done:#2D7A4F;--done-soft:#E2F2E8;--wip:#A66508;--wip-soft:#FBEFD9;--danger:#B3372F;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171D;--surface:#19222B;--ink:#E6ECF1;--muted:#93A2B0;--faint:#5F6E7C;--line:#2B3743;--soft:#151C23;
  --accent:#7FB2E0;--accent-soft:#1F3347;--rest:#232B33;
  --done:#6CCB93;--done-soft:#183526;--wip:#E8B064;--wip-soft:#3A2C14;--danger:#F08A80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171D;--surface:#19222B;--ink:#E6ECF1;--muted:#93A2B0;--faint:#5F6E7C;--line:#2B3743;--soft:#151C23;
  --accent:#7FB2E0;--accent-soft:#1F3347;--rest:#232B33;
  --done:#6CCB93;--done-soft:#183526;--wip:#E8B064;--wip-soft:#3A2C14;--danger:#F08A80;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 96px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--f-display);font-size:28px;line-height:1.25;margin:2px 0 0;text-wrap:balance}
.meta{font-size:13px;color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.icon{padding:4px 10px;font-size:16px;line-height:1.2}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .range{font-family:var(--f-num);font-weight:500;font-size:14px;color:var(--muted)}
.chip{font-size:11px;font-weight:500;background:var(--accent);color:var(--surface);border-radius:4px;padding:1px 6px;line-height:1.5}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.goal{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1.2fr);gap:12px 16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .t{font-weight:500}
.goal .n{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.wip{background:var(--wip-soft);color:var(--wip)}
.tag{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.empty{font-size:13px;color:var(--muted)}
/* calendar */
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav b{font-family:var(--f-num);font-weight:500;font-size:15px;min-width:96px;text-align:center}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dow,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{font-size:12px;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line);letter-spacing:.08em}
.dow div:nth-child(n+6){color:var(--danger)}
.wk{border-top:1px solid var(--line)}
.dow + .wk{border-top:0}
.cell{min-width:0;border-left:1px solid var(--line);padding:6px 8px}
.cell:first-child{border-left:0}
.dn{font-family:var(--f-num);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.wk.mini .cell.out,.wk.none .cell.out{background:color-mix(in srgb,var(--line) 35%,transparent)}
.today .dn b{background:var(--accent);color:var(--surface);border-radius:4px;padding:0 5px}
.dn b{font-weight:500}
.mo{font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--accent)}
/* compact week */
.wk.mini{cursor:pointer;background:var(--soft)}
.wk.mini:hover{background:var(--accent-soft)}
.wk.mini .cell{height:74px;overflow:hidden}
.mini-t{font-size:12px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mini-t.d{color:var(--muted)}
.mini-t i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:5px;vertical-align:1px}
.mini-t.d i{background:var(--done)}
.more{font-size:11px;color:var(--muted)}
.wk.none{cursor:default;background:var(--soft)}
.wk.none .cell{height:44px}
.wk.none.can{cursor:pointer}
.wk.none.can:hover{background:var(--accent-soft)}
.wk.none .hint{display:none}
.wk.none.can:hover .hint{display:inline}
.hint{font-size:11px;color:var(--accent)}
/* open week */
.band{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--accent-soft);border-top:1px solid var(--line);font-size:13px}
.dow + .band{border-top:0}
.band .r{font-family:var(--f-num);font-weight:500;color:var(--accent)}
.wk.open{border-top:0}
.wk.open .cell{min-height:200px;padding:10px;display:flex;flex-direction:column;gap:8px}
.wk.open .cell.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.wd{display:none}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.tasks li{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;line-height:1.5;min-width:0}
ul.tasks li span{overflow-wrap:anywhere}
.ck{flex:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);margin-top:3px;display:inline-flex;align-items:center;justify-content:center}
.ck.on{background:var(--done);border-color:var(--done)}
.ck.on::after{content:"";width:4px;height:7px;border:solid var(--surface);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-.5px,-1px)}
li.is-done span{color:var(--muted)}
/* edit mode */
.erow{display:flex;gap:6px;align-items:center;min-width:0}
.erow input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:4px 7px;font-size:13.5px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--done);flex:none;margin:0}
.goal.edit{grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr) auto}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:2px 4px;border-radius:4px;flex:none}
.x:hover{color:var(--danger)}
.add{align-self:flex-start;border:1px dashed var(--line);background:none;border-radius:8px;padding:3px 9px;font-size:12.5px;color:var(--accent);cursor:pointer}
.goals .add{margin:10px 18px 14px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.msg{font-size:14px}
.msg.err{color:var(--danger)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reporter{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pwin{width:150px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 10px;font-size:14px}
.reporter input{width:120px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:3px 8px}
@media (max-width:720px){
  h1{font-size:23px}
  .goal{grid-template-columns:auto minmax(0,1fr);padding:12px 14px}
  .goal .n{grid-column:2}
  .goal.edit{grid-template-columns:auto minmax(0,1fr) auto}
  .goal.edit .n{grid-column:2 / 3}
  .cell{padding:5px 4px}
  .wk.mini .cell{height:52px}
  .mini-t{font-size:0;line-height:0;display:inline-block;margin-right:2px}
  .mini-t i{margin:0}
  .more{display:none}
  .dn{font-size:11px;justify-content:center}
  .wk.open{grid-template-columns:1fr}
  .wk.open .cell{min-height:0;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:72px minmax(0,1fr);align-items:start;gap:8px;padding:10px 12px}
  .wk.open .cell:first-child{border-top:0}
  .wk.open .dn{justify-content:flex-start;font-size:12px}
  .wk.open .wd{display:inline;font-family:var(--f-body);color:var(--ink);font-weight:500}
  .wk.open .body{display:flex;flex-direction:column;gap:6px;min-width:0}
}
.body{display:flex;flex-direction:column;gap:6px;min-width:0}

/* day status + roomy editing */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;min-width:0}
.st{font-size:11px;font-weight:500;border-radius:4px;padding:0 6px;line-height:1.7;white-space:nowrap}
.st-leave{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.st-off{background:var(--line);color:var(--muted)}
.cell.is-leave,.cell.is-off,.wk.mini .cell.is-leave,.wk.mini .cell.is-off,.wk.open .cell.today.is-leave,.wk.open .cell.today.is-off{background:var(--rest)}
.stsel{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:2px 6px}
textarea.grow{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:5px 8px;font:inherit;font-size:14px;line-height:1.55;resize:none;overflow:hidden;display:block;box-sizing:border-box}
.erow{align-items:flex-start}
.erow input[type=checkbox]{margin-top:7px}
.erow .x{margin-top:3px}
ul.tasks li span,.goal .t,.goal .n{white-space:pre-wrap}
.wk.open.list{grid-template-columns:1fr}
.wk.open.list .cell{min-height:0;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;padding:12px 16px;align-items:start}
.wk.open.list .cell:first-child{border-top:0}
.wk.open.list .dhead{flex-direction:column;align-items:flex-start;gap:6px}
.wk.open.list .dn{justify-content:flex-start;font-size:13px}
.wk.open.list .wd{display:inline;font-family:var(--f-body);color:var(--ink);font-weight:500}
@media (max-width:720px){.wk.open.list .cell{grid-template-columns:1fr;gap:8px}.wk.open.list .dhead{flex-direction:row;align-items:center}}
/* tabs */
.tabs-wrap{overflow-x:auto;margin:-4px 0;padding:4px 0}
.tabs{display:flex;gap:8px;width:max-content;min-width:100%}
.tab{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.tab.add-tab{border-style:dashed;color:var(--accent);background:transparent}
/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:16px}
.panel p{margin:0;font-size:14px;color:var(--muted)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.danger-row{border-top:1px solid var(--line);padding-top:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input{font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;min-width:0}
.monthnav b{min-width:0}
/* overview */
.ov-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ov{min-width:920px}
.ov-row{display:grid;grid-template-columns:170px repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.ov-row:first-child{border-top:0}
.ov-head{font-size:12px;color:var(--muted)}
.ov-head>div{padding:8px 10px;letter-spacing:.04em}
.ov-hd span{font-family:var(--f-num)}
.ov-hd.today{color:var(--accent);font-weight:700}
.ov-name{padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ov-link{font:inherit;font-weight:700;font-size:15px;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left}
.ov-link:hover{text-decoration:underline}
.ov-goals,.ov-tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ov-goals li,.ov-tasks li{font-size:12.5px;line-height:1.45;display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.ov-goals li{color:var(--muted)}
.ov-goals i,.ov-tasks i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:6px}
.ov-goals li.d i,.ov-tasks li.d i{background:var(--done)}
.ov-tasks li.d{color:var(--muted)}
.ov-cell{border-left:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ov-cell.today{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.ov-cell.is-leave{background:color-mix(in srgb,var(--wip-soft) 55%,var(--surface))}
.ov-cell.is-off{background:var(--soft)}
.ov-dl{display:none;align-items:center;gap:6px}
.ov-cell .ov-dl{display:flex;justify-content:flex-end}
.ov-cell .ov-dl .wd{display:none}
.ov-none{grid-column:2 / -1;border-left:1px solid var(--line);padding:12px;font-size:13px;color:var(--muted);display:flex;align-items:center}
.wk.none.cur{background:var(--accent-soft)}
@media (max-width:720px){
  .ov-scroll{overflow:visible;background:transparent;border:0;border-radius:0}
  .ov{min-width:0;display:flex;flex-direction:column;gap:12px}
  .ov-head{display:none}
  .ov-row{grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ov-cell{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:8px 12px}
  .ov-cell.blank{display:none}
  .ov-cell .ov-dl{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px}
  .ov-cell .ov-dl .wd{display:inline;font-size:12.5px;color:var(--ink);font-weight:500}
  .ov-none{border-left:0;border-top:1px solid var(--line)}
}

header{align-items:center}
.whoami{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted)}
.toolbar.who{justify-content:flex-start}
.who-name{font-size:20px;margin-right:auto}
.panel.login{max-width:560px}
.fsel{font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;min-width:0}
.row.sep{border-top:1px solid var(--line);padding-top:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.sh .btn.danger{margin-left:auto}
/* tabs */
.tabs-wrap{overflow-x:auto;margin:-4px 0;padding:4px 0}
.tabs{display:flex;gap:8px;width:max-content;min-width:100%}
.tab{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;white-space:nowrap}
.tab:hover{border-color:var(--accent)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.tab.add-tab{border-style:dashed;color:var(--accent);background:transparent}
/* panels & forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:16px}
.panel p{margin:0;font-size:14px;color:var(--muted)}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.danger-row{border-top:1px solid var(--line);padding-top:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input{font:inherit;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;min-width:0}
.monthnav b{min-width:0}
.wk.none.cur{background:var(--accent-soft)}

/* open week: hovered / clicked day widens, others shrink */
@media (min-width:721px){
  .wk.open{grid-template-columns:var(--cols,repeat(7,minmax(0,1fr)));transition:grid-template-columns .22s ease}
  .wk.open .cell{min-height:170px;cursor:default}
  .wk.open .cell.narrow ul.tasks li{font-size:12.5px}
  .wk.open .cell.narrow .erow .x{display:none}
  .wk.open .cell.narrow textarea.grow{font-size:12.5px;padding:4px 6px}
  .wk.open .cell.narrow .stsel{font-size:11.5px;padding:1px 2px;max-width:100%}
  .wk.open .cell.narrow .add{padding:2px 6px;font-size:12px}
  .wk.open .cell.wide{box-shadow:inset 0 0 0 2px var(--accent-soft)}
  .wk.open.editing .cell{cursor:pointer}
}
@media (prefers-reduced-motion:reduce){.wk.open{transition:none}}

/* member management */
.mg{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mg-row{display:grid;grid-template-columns:minmax(0,1.3fr) 80px 70px minmax(0,1fr) 150px;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.mg-row:first-child{border-top:0}
.mg-head{font-size:12px;color:var(--muted);padding-block:8px}
.mg-name{display:flex;align-items:center;gap:8px;min-width:0}
.mg-in{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 9px;min-width:0;width:100%;box-sizing:border-box}
.panel .row .mg-in{width:auto;flex:1 1 160px}
.mg-ck{display:flex;align-items:center;gap:6px;cursor:pointer}
.mg-ck input{width:17px;height:17px;accent-color:var(--accent)}
.mg-lab{display:none;font-size:13px}
.mg-act{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:720px){
  .mg-head{display:none}
  .mg-row{grid-template-columns:1fr 1fr;padding:12px 14px}
  .mg-name,.mg-pw,.mg-act{grid-column:1 / -1}
  .mg-act{justify-content:flex-start}
  .mg-lab{display:inline}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
// ★ Google Apps Script 的網址（資料存放處）。如果之後重新「新增部署作業」產生了新網址，換掉這一行即可。
var API_URL='https://script.google.com/macros/s/AKfycbyyXW4rkEVsuWVrJOSne2Z056RUrSXd0sT-LwP1GgnqEJrxTR1ZwHKs9-zR2h6yQOj0BA/exec';

var DAYS=[['mon','週一',0],['tue','週二',1],['wed','週三',2],['thu','週四',3],['fri','週五',4],['sat','週六',5],['sun','週日',6]];
var ST={work:'上班',leave:'請假',off:'休假'};
var members=[],data={},versions={},snap={},names=[];
var me=null;                  // 登入者 {id,name,admin,viewAll}
var loaded=false,editing=false,busy=false,msg='',msgErr=false,confirmDel=false;
var view=null;                // 目前看的成員 id
var screen='login';           // 'login' | 'join' | 'app'
var panel=null;               // 'settings' | null
var formErr='',formBusy=false,confirmRemove=false,reauth=false;
var screen2=null,mgDel=null,mgBusy=false;   // 成員管理畫面
var app=document.getElementById('app');

function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function md(d){return (d.getMonth()+1)+'/'+d.getDate();}
function label(w){var s=pd(w.start);return md(s)+' – '+md(add(s,6));}
function uid(){return Math.random().toString(36).slice(2,9);}
function mondayOf(d){return add(d,-((d.getDay()+6)%7));}
var today=new Date();today=new Date(today.getFullYear(),today.getMonth(),today.getDate());
var thisMonday=iso(mondayOf(today));
var curStart=thisMonday;
var pinnedDay=null,pinnedFor=null;   // 放大顯示的那一天

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
var login=null;try{login=JSON.parse(ls('wr-login')||'null');}catch(e){login=null;}
function setLogin(l){login=l;ls('wr-login',l?JSON.stringify(l):null);}
function auth(){return {as:login&&login.id,password:login&&login.pw};}
function canEdit(mid){return !!me&&(me.admin||me.id===mid);}

function member(id){return members.filter(function(m){return m.id===id;})[0];}
function weeksOf(mid){return (data[mid]||(data[mid]={weeks:[]})).weeks;}
function sortedOf(mid){return weeksOf(mid).slice().sort(function(a,b){return a.start<b.start?-1:1;});}
function findWeek(mid,s){return weeksOf(mid).filter(function(w){return w.start===s;})[0];}
function list(w,k){return w.days[k]||(w.days[k]=[]);}
function normWeek(o){var w={start:o.start,goals:Array.isArray(o.goals)?o.goals:[],days:{}};var d=o.days||{};
  DAYS.forEach(function(x){w.days[x[0]]=Array.isArray(d[x[0]])?d[x[0]]:[];});
  if(o.status&&Object.keys(o.status).length)w.status=o.status;return w;}
function defStatus(k){return (k==='sat'||k==='sun')?'off':'work';}
function dayStatus(w,k){var s=w&&w.status&&w.status[k];return s||defStatus(k);}
function setStatus(w,k,v){w.status=w.status||{};if(v===defStatus(k))delete w.status[k];else w.status[k]=v;if(!Object.keys(w.status).length)delete w.status;}

// ---------- 資料同步 ----------
function load(res){
  me=res.me;var d=res.data||{};
  members=d.members||[];data={};versions={};snap={};
  members.forEach(function(m){data[m.id]={weeks:[]};});
  (d.rows||[]).forEach(function(r){
    var i=r.key.indexOf('|');if(i<0)return;
    var mid=r.key.slice(0,i),o;try{o=normWeek(JSON.parse(r.json));}catch(e){return;}
    if(!data[mid])return;
    versions[r.key]=r.version;snap[r.key]=JSON.stringify(o);data[mid].weeks.push(o);
  });
  if(!member(view)){var last=ls('wr-view');view=member(last)?last:(me&&member(me.id)?me.id:(members[0]?members[0].id:null));}
  loaded=true;screen='app';
}
function changesOf(mid){
  var out=[],seen={};
  if(!mid||!data[mid])return out;
  weeksOf(mid).forEach(function(w){
    var k=mid+'|'+w.start,j=JSON.stringify(w);seen[k]=1;
    if(snap[k]!==j)out.push({key:k,json:j,baseVersion:versions[k]||0});
  });
  Object.keys(snap).forEach(function(k){if(k.indexOf(mid+'|')===0&&!seen[k])out.push({key:k,json:null,baseVersion:versions[k]||0});});
  return out;
}
function dirty(){return loaded&&editing&&changesOf(view).length>0;}
function api(body,ok,fail){
  var req=body?fetch(API_URL,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
              :fetch(API_URL+'?api=1&t='+Date.now(),{credentials:'omit',cache:'no-store'});
  req.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
     .then(function(res){if(res&&res.error==='bad_request')throw new Error(res.error);ok(res);})
     .catch(function(e){(fail||function(){})(e);});
}
function loadNames(){api(null,function(res){names=res.members||[];if(screen==='login')render();},function(){});}
function refresh(first){
  if(!login){screen='login';loadNames();render();return;}
  api(Object.assign({action:'load'},auth()),function(res){
    if(res.denied){if(first){setLogin(null);screen='login';formErr='登入已失效，請重新登入。';loadNames();render();}return;}
    if(!first&&(dirty()||busy||panel))return;
    var a=document.activeElement;if(!first&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
    var before=JSON.stringify({m:members,s:snap});load(res);
    if(first||JSON.stringify({m:members,s:snap})!==before)render();
  },function(err){
    if(first){app.innerHTML='';app.appendChild(h('div',{cls:'wrap'},[h('p',{cls:'empty',text:'讀取失敗，請重新整理頁面再試一次。（'+((err&&err.message)||'未知錯誤')+'）'})]));}
  });
}

function h(tag,attrs,kids){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='text')el.textContent=v;else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(k==='cls')el.className=v;else el.setAttribute(k,v===true?'':v);}
  (kids||[]).forEach(function(c){if(c!=null)el.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return el;
}
function grow(el){el.style.height='auto';el.style.height=(el.scrollHeight+2)+'px';}
function ta(id,val,ph,on){var el=h('textarea',{id:id,rows:'1',cls:'grow',placeholder:ph,oninput:function(e){on(e.target.value);grow(e.target);bar();}});el.value=val||'';return el;}
function field(id,lab,type,ph){return h('label',{cls:'field'},[h('span',{text:lab}),h('input',{id:id,type:type||'text',placeholder:ph||'',autocomplete:type==='password'?'current-password':'off'})]);}
function val(id){var el=document.getElementById(id);return el?el.value:'';}
var ERR={name_empty:'請填寫名字',name_taken:'這個名字已經有人用了，換一個試試',pw_short:'密碼至少要 4 個字',no_member:'找不到這位成員'};

function go(v){
  if(v===view)return;
  if(dirty()){msg='請先儲存或捨棄目前的變更，再切換分頁。';msgErr=true;bar();return;}
  view=v;ls('wr-view',v);editing=false;panel=null;confirmDel=false;confirmRemove=false;msg='';render();window.scrollTo(0,0);
}
function logout(){
  if(dirty()){msg='請先儲存或捨棄目前的變更，再登出。';msgErr=true;bar();return;}
  screen2=null;setLogin(null);me=null;members=[];data={};snap={};versions={};loaded=false;editing=false;panel=null;msg='';view=null;screen='login';formErr='';loadNames();render();
}

// ---------- 畫面 ----------
function render(){
  app.innerHTML='';
  var wrap=h('div',{cls:'wrap'});app.appendChild(wrap);
  var head=h('header',null,[h('h1',{text:'工作週報'})]);
  wrap.appendChild(head);
  if(screen==='login'){wrap.appendChild(loginScreen());bar();return;}
  if(screen==='join'){wrap.appendChild(joinScreen());bar();return;}
  if(!loaded){wrap.appendChild(h('p',{cls:'empty',text:'週報載入中…'}));return;}
  head.appendChild(h('div',{cls:'whoami'},[h('span',{text:(me.admin?'管理者 · ':'')+(me.name||'')}),
    me.admin?h('button',{cls:'btn'+(screen2==='manage'?' primary':''),id:'manage',onclick:function(){
      if(dirty()){msg='請先儲存或捨棄目前的變更。';msgErr=true;bar();return;}
      screen2=screen2==='manage'?null:'manage';editing=false;panel=null;mgDel=null;render();},text:screen2==='manage'?'回到週報':'成員管理'}):null,
    h('button',{cls:'btn ghost',id:'logout',onclick:logout,text:'登出'})]));
  if(screen2==='manage'&&me.admin){manageView(wrap);bar();return;}
  var m=member(view);
  if(members.length>1)wrap.appendChild(tabs());
  if(!m){wrap.appendChild(h('div',{cls:'panel'},[h('p',{text:'目前沒有可以查看的週報。'})]));bar();return;}
  wrap.appendChild(editBar(m));
  if(panel==='settings')wrap.appendChild(settingsPanel(m));
  memberView(wrap,m);
  app.querySelectorAll('textarea.grow').forEach(grow);
  bar();
}

function tabs(){
  var t=h('nav',{cls:'tabs','aria-label':'成員'});
  members.forEach(function(m){t.appendChild(h('button',{cls:'tab'+(view===m.id?' on':''),id:'tab-'+m.id,onclick:function(){go(m.id);},text:m.name+(me&&m.id===me.id?'（我）':'')}));});
  return h('div',{cls:'tabs-wrap'},[t]);
}

function editBar(m){
  var t=h('div',{cls:'toolbar who'},[h('h2',{cls:'who-name',text:m.name})]);
  if(canEdit(m.id)){
    t.appendChild(h('button',{cls:'btn'+(editing?' primary':''),id:'edit-toggle',onclick:function(){
      if(editing&&dirty()){msg='請先儲存或捨棄目前的變更。';msgErr=true;bar();return;}
      editing=!editing;confirmDel=false;if(!editing)panel=null;render();},text:editing?'完成編輯':'編輯週報'}));
    if(editing&&me.id===m.id)t.appendChild(h('button',{cls:'btn ghost',id:'settings',onclick:function(){panel=panel==='settings'?null:'settings';formErr='';confirmRemove=false;render();},text:'成員設定'}));
  }
  return t;
}

function loginScreen(){
  var submit=function(){
    var id=val('l-name'),pw=val('l-pw');
    if(!id){formErr='請選擇你的名字';render();return;}
    if(!pw){formErr='請輸入密碼';render();return;}
    formBusy=true;formErr='';render();
    api({action:'load',as:id,password:pw},function(res){
      formBusy=false;
      if(res.denied){formErr='密碼不對';render();return;}
      setLogin({id:id,pw:pw});view=null;load(res);if(me.id&&member(me.id)&&!me.viewAll)view=me.id;render();
    },function(){formBusy=false;formErr='連線失敗，請再試一次';render();});
  };
  var sel=h('select',{id:'l-name',cls:'fsel'},[h('option',{value:'',text:names.length?'請選擇':'載入中…'})].concat(names.map(function(n){return h('option',{value:n.id,text:n.name});})));
  var p=h('div',{cls:'panel login'},[
    h('h3',{text:'登入'}),
    h('div',{cls:'fields'},[h('label',{cls:'field'},[h('span',{text:'你的名字'}),sel]),
      h('label',{cls:'field'},[h('span',{text:'密碼'}),h('input',{id:'l-pw',type:'password',autocomplete:'current-password',onkeydown:function(e){if(e.key==='Enter')submit();}})])]),
    h('div',{cls:'row'},[h('button',{cls:'btn primary',id:'l-ok',disabled:formBusy||null,onclick:submit,text:formBusy?'登入中…':'登入'})]),
    formErr?h('p',{cls:'msg err',text:formErr}):null,
    h('div',{cls:'row sep'},[h('span',{cls:'meta',text:'第一次使用？'}),h('button',{cls:'btn',id:'go-join',onclick:function(){screen='join';formErr='';render();},text:'＋ 新增我的分頁'})])]);
  return p;
}

function joinScreen(){
  var submit=function(){
    var n=val('j-name').trim(),a=val('j-pw'),b=val('j-pw2');
    if(!n){formErr=ERR.name_empty;render();return;}
    if(a.length<4){formErr=ERR.pw_short;render();return;}
    if(a!==b){formErr='兩次輸入的密碼不一樣';render();return;}
    formBusy=true;formErr='';render();
    api({action:'join',name:n,password:a},function(res){
      formBusy=false;
      if(!res.ok){formErr=ERR[res.error]||'建立失敗，請再試一次';render();return;}
      setLogin({id:res.member.id,pw:a});view=res.member.id;ls('wr-view',view);load(res);
      editing=true;curStart=thisMonday;if(!findWeek(view,thisMonday))createWeek(view,thisMonday,true);
      msg='分頁建立好了！填好本週工作後，記得按「儲存並更新」。';msgErr=false;render();
    },function(){formBusy=false;formErr='連線失敗，請再試一次';render();});
  };
  return h('div',{cls:'panel login'},[
    h('h3',{text:'新增我的分頁'}),
    h('p',{text:'填上你的名字並設定一組密碼。之後用名字和這組密碼登入，編輯自己的週報。'}),
    h('div',{cls:'fields'},[field('j-name','名字','text','例如：小美'),field('j-pw','設定密碼','password','至少 4 個字'),field('j-pw2','再輸入一次密碼','password','')]),
    h('div',{cls:'row'},[h('button',{cls:'btn primary',id:'j-ok',disabled:formBusy||null,onclick:submit,text:formBusy?'建立中…':'建立分頁'}),
      h('button',{cls:'btn ghost',id:'j-back',onclick:function(){screen='login';formErr='';render();},text:'返回登入'})]),
    formErr?h('p',{cls:'msg err',text:formErr}):null,
    h('p',{cls:'meta',text:'忘記密碼的話，請找管理者幫你重設。'})]);
}

function settingsPanel(m){
  var send=function(body,after){
    if(dirty()){formErr='請先儲存或捨棄週報的變更，再修改成員設定。';render();return;}
    formBusy=true;formErr='';render();
    api(Object.assign({action:'member',member:m.id},auth(),body),function(res){
      formBusy=false;
      if(res.denied){formErr='沒有權限，或登入已失效，請登出後重新登入';render();return;}
      if(!res.ok){formErr=ERR[res.error]||'更新失敗，請再試一次';render();return;}
      after();load(res);render();
    },function(){formBusy=false;formErr='連線失敗，請再試一次';render();});
  };
  var submit=function(){
    var n=val('s-name').trim(),a=val('s-pw'),b=val('s-pw2'),body={};
    if(n&&n!==m.name)body.name=n;
    if(a||b){if(a.length<4){formErr=ERR.pw_short;render();return;}if(a!==b){formErr='兩次輸入的新密碼不一樣';render();return;}body.newPassword=a;}
    if(!body.name&&!body.newPassword){panel=null;render();return;}
    send(body,function(){if(body.newPassword&&login&&login.id===m.id&&!me.admin)setLogin({id:login.id,pw:a});panel=null;msg='成員設定已更新';msgErr=false;});
  };
  var nameIn=field('s-name','名字','text','');nameIn.querySelector('input').value=m.name;
  var kids=[h('h3',{text:'我的帳號設定'}),
    h('div',{cls:'fields'},[nameIn,field('s-pw','新密碼（不改就留空）','password','至少 4 個字'),field('s-pw2','再輸入一次新密碼','password','')]),
    h('div',{cls:'row'},[h('button',{cls:'btn primary',id:'s-ok',disabled:formBusy||null,onclick:submit,text:formBusy?'更新中…':'更新設定'}),
      h('button',{cls:'btn ghost',onclick:function(){panel=null;render();},text:'取消'})])];
  if(formErr)kids.push(h('p',{cls:'msg err',text:formErr}));
  return h('div',{cls:'panel'},kids);
}

// ---------- 個人週報 ----------
function memberView(wrap,m){
  var mid=m.id,w=findWeek(mid,curStart);
  var gl=h('div',{cls:'goals'});
  if(w){
    w.goals.forEach(function(g,i){
      if(editing){
        gl.appendChild(h('div',{cls:'goal edit'},[
          h('input',{type:'checkbox',id:'gd-'+g.id,'aria-label':'完成',checked:g.done||null,onchange:function(e){g.done=e.target.checked;render();}}),
          h('div',{cls:'erow'},[ta('gt-'+g.id,g.text,'工作項目',function(v){g.text=v;})]),
          h('div',{cls:'erow n'},[ta('gn-'+g.id,g.note,'目前進度說明',function(v){g.note=v;})]),
          h('button',{cls:'x','aria-label':'刪除此項',onclick:function(){w.goals.splice(i,1);render();},text:'×'})]));
      }else{
        gl.appendChild(h('div',{cls:'goal'},[
          h('span',{cls:'pill '+(g.done?'done':'wip'),text:g.done?'✓ 完成':'進行中'}),
          h('div',{cls:'t'},[g.text,g.carried?h('span',{cls:'tag',text:'延續上週'}):null]),
          h('div',{cls:'n',text:g.note||''})]));
      }
    });
    if(!w.goals.length&&!editing)gl.appendChild(h('div',{cls:'goal'},[h('span',{cls:'empty',text:'這週沒有提列重點工作'})]));
    if(editing)gl.appendChild(h('button',{cls:'add',id:'add-goal',onclick:function(){var id=uid();w.goals.push({id:id,text:'',note:'',done:false});render();var el=document.getElementById('gt-'+id);if(el)el.focus();},text:'＋ 新增重點工作'}));
  }else{
    gl.appendChild(h('div',{cls:'goal'},[h('span',{cls:'empty',text:'這週還沒有填寫'}),
      editing?h('button',{cls:'add',id:'create-cur',onclick:function(){createWeek(mid,curStart);},text:'＋ 建立這週'}):null]));
  }
  var delBtn=(editing&&w)?h('button',{cls:'btn ghost danger',id:'del-week',onclick:function(){if(!confirmDel){confirmDel=true;render();return;}delWeek(mid);},text:confirmDel?'確定刪除 '+label(w)+'？再按一次':'刪除這一週'}):null;
  wrap.appendChild(h('section',null,[h('div',{cls:'sh'},[h('h2',null,['重點工作',h('span',{cls:'range',text:label({start:curStart})}),curStart===thisMonday?h('span',{cls:'chip',text:'本週'}):null]),delBtn]),gl]));

  var nav=h('div',{cls:'monthnav'},[curStart!==thisMonday?h('button',{cls:'btn ghost',id:'go-today',onclick:function(){curStart=thisMonday;confirmDel=false;render();},text:'回到本週'}):null]);
  var cal=h('div',{cls:'cal'},[h('div',{cls:'dow','aria-hidden':'true'},['一','二','三','四','五','六','日'].map(function(t){return h('div',{text:t});}))]);
  var ws=sortedOf(mid),first=ws.length?ws[0].start:thisMonday,last=ws.length?ws[ws.length-1].start:thisMonday;
  if(thisMonday<first)first=thisMonday;if(curStart<first)first=curStart;
  var endBase=last>thisMonday?last:thisMonday;if(curStart>endBase)endBase=curStart;
  var end=iso(add(pd(endBase),editing?28:0));
  for(var d=pd(first);iso(d)<=end;d=add(d,7)){
    var s=iso(d),wk=findWeek(mid,s);
    if(wk&&s===curStart)openWeek(cal,mid,wk);
    else if(wk)cal.appendChild(miniWeek(wk));
    else cal.appendChild(noWeek(mid,s));
  }
  wrap.appendChild(h('section',null,[h('div',{cls:'sh'},[h('h2',null,['每日工作']),nav]),cal]));
}
function selectWeek(s){curStart=s;confirmDel=false;render();}

function dateCell(d,cls,kids){
  var isToday=d.getTime()===today.getTime(),out=d.getMonth()%2===1;
  return h('div',{cls:'cell'+(cls?' '+cls:'')+(isToday?' today':'')+(out?' out':'')},kids);
}
function dn(d,k){return h('div',{cls:'dn'},[k?h('span',{cls:'wd',text:k}):null,h('b',{text:String(d.getDate())}),d.getDate()===1?h('span',{cls:'mo',text:(d.getMonth()+1)+'月'}):null]);}

function miniWeek(w){
  var s=pd(w.start);
  var row=h('div',{cls:'wk mini',role:'button',tabindex:'0','aria-label':'查看 '+label(w),onclick:function(){selectWeek(w.start);},
    onkeydown:function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();selectWeek(w.start);}}});
  DAYS.forEach(function(d){
    var date=add(s,d[2]),l=list(w,d[0]),st=dayStatus(w,d[0]),kids=[h('div',{cls:'dhead'},[dn(date),st!=='work'?h('span',{cls:'st st-'+st,text:ST[st]}):null])];
    l.slice(0,2).forEach(function(t){kids.push(h('div',{cls:'mini-t'+(t.done?' d':''),title:t.text},[h('i'),t.text]));});
    if(l.length>2)kids.push(h('div',{cls:'more',text:'+'+(l.length-2)}));
    row.appendChild(dateCell(date,st!=='work'?'is-'+st:null,kids));
  });
  return row;
}
function noWeek(mid,s){
  var can=editing,start=pd(s),isCur=s===curStart;
  var row=h('div',{cls:'wk none'+(can?' can':'')+(isCur?' cur':''),role:can?'button':null,tabindex:can?'0':null,'aria-label':can?'建立 '+md(start)+' 這一週':null,
    onclick:can?function(){createWeek(mid,s);}:function(){selectWeek(s);},onkeydown:can?function(e){if(e.key==='Enter'){createWeek(mid,s);}}:null});
  DAYS.forEach(function(d,i){var date=add(start,d[2]);row.appendChild(dateCell(date,null,[h('div',{cls:'dn'},[h('b',{text:String(date.getDate())}),i===0&&can?h('span',{cls:'hint',text:'＋ 建立這週'}):null])]));});
  return row;
}
function openWeek(cal,mid,w){
  var s=pd(w.start);
  cal.appendChild(h('div',{cls:'band'},[h('span',null,[h('span',{cls:'r',text:label(w)}),w.start===thisMonday?h('span',{cls:'chip',style:'margin-left:8px',text:'本週'}):null])]));
  var row=h('div',{cls:'wk open'+(editing?' editing':'')});
  if(pinnedFor!==w.start){pinnedFor=w.start;pinnedDay=null;DAYS.forEach(function(d){if(add(s,d[2]).getTime()===today.getTime())pinnedDay=d[0];});}
  var hoverT=null;
  function applyCols(k){
    row.style.setProperty('--cols',DAYS.map(function(d){return d[0]===k?'minmax(0,3.2fr)':'minmax(0,1fr)';}).join(' '));
    row.querySelectorAll('.cell').forEach(function(c){c.classList.toggle('wide',c.getAttribute('data-k')===k);c.classList.toggle('narrow',!!k&&c.getAttribute('data-k')!==k);});
    setTimeout(function(){row.querySelectorAll('textarea.grow').forEach(grow);},230);
  }
  row.addEventListener('mouseleave',function(){clearTimeout(hoverT);hoverT=setTimeout(function(){applyCols(pinnedDay);},150);});
  DAYS.forEach(function(d){
    var date=add(s,d[2]),l=list(w,d[0]),body=h('div',{cls:'body'}),st=dayStatus(w,d[0]);
    var stEl=editing?h('select',{id:'st-'+d[0],cls:'stsel','aria-label':d[1]+'出勤',onchange:function(e){setStatus(w,d[0],e.target.value);render();}},
      ['work','leave','off'].map(function(v){var o=h('option',{value:v,text:ST[v]});if(v===st)o.selected=true;return o;}))
      :(st!=='work'?h('span',{cls:'st st-'+st,text:ST[st]}):null);
    if(editing){
      l.forEach(function(t,i){
        body.appendChild(h('div',{cls:'erow'},[
          h('input',{type:'checkbox',id:'dd-'+t.id,'aria-label':'完成',checked:t.done||null,onchange:function(e){t.done=e.target.checked;render();}}),
          ta('dt-'+t.id,t.text,'工作內容',function(v){t.text=v;}),
          h('button',{cls:'x','aria-label':'刪除此項',onclick:function(){l.splice(i,1);render();},text:'×'})]));
      });
      body.appendChild(h('button',{cls:'add',id:'add-'+d[0],onclick:function(){var id=uid();l.push({id:id,text:'',done:false});render();var el=document.getElementById('dt-'+id);if(el)el.focus();},text:'＋ 新增'}));
    }else if(l.length){
      body.appendChild(h('ul',{cls:'tasks'},l.map(function(t){return h('li',{cls:t.done?'is-done':null},[h('i',{cls:'ck'+(t.done?' on':''),'aria-label':t.done?'已完成':'進行中'}),h('span',{text:t.text})]);})));
    }
    var cell=dateCell(date,st!=='work'?'is-'+st:null,[h('div',{cls:'dhead'},[dn(date,d[1]),stEl]),body]);
    cell.setAttribute('data-k',d[0]);
    cell.addEventListener('mouseenter',function(){clearTimeout(hoverT);hoverT=setTimeout(function(){applyCols(d[0]);},120);});
    cell.addEventListener('click',function(){if(pinnedDay!==d[0]){pinnedDay=d[0];applyCols(d[0]);}});
    cell.addEventListener('focusin',function(){if(pinnedDay!==d[0]){pinnedDay=d[0];clearTimeout(hoverT);applyCols(d[0]);}});
    row.appendChild(cell);
  });
  cal.appendChild(row);
  applyCols(pinnedDay);
}

function emptyDays(){var o={};DAYS.forEach(function(d){o[d[0]]=[];});return o;}
function createWeek(mid,start,silent){
  if(findWeek(mid,start)){if(!silent)selectWeek(start);return;}
  var prev=sortedOf(mid).filter(function(w){return w.start<start;}).pop();
  var goals=prev?prev.goals.filter(function(g){return !g.done&&(g.text||'').trim();}).map(function(g){return {id:uid(),text:g.text,note:g.note||'',done:false,carried:true};}):[];
  weeksOf(mid).push({start:start,goals:goals,days:emptyDays()});
  curStart=start;confirmDel=false;if(!silent)render();
}
function delWeek(mid){
  data[mid].weeks=weeksOf(mid).filter(function(w){return w.start!==curStart;});
  confirmDel=false;render();
}


// ---------- 成員管理（管理者） ----------
function mgSend(body,okMsg,after){
  if(mgBusy)return;mgBusy=true;msg='更新中…';msgErr=false;bar();
  api(Object.assign({},auth(),body),function(res){
    mgBusy=false;
    if(res.denied){msg='沒有權限，或登入已失效，請登出後重新登入。';msgErr=true;render();return;}
    if(!res.ok){msg=ERR[res.error]||'更新失敗，請再試一次';msgErr=true;render();return;}
    load(res);if(after)after();msg=okMsg;msgErr=false;render();
    setTimeout(function(){if(msg===okMsg){msg='';bar();}},2500);
  },function(){mgBusy=false;msg='連線失敗，請再試一次';msgErr=true;render();});
}
function manageView(wrap){
  var sec=h('section',null,[h('div',{cls:'sh'},[h('h2',{text:'成員管理'}),h('span',{cls:'meta',text:'共 '+members.length+' 位'})])]);
  var box=h('div',{cls:'mg'});
  box.appendChild(h('div',{cls:'mg-row mg-head'},[h('div',{text:'名字'}),h('div',{text:'可看全部'}),h('div',{text:'管理者'}),h('div',{text:'重設密碼'}),h('div')]));
  members.forEach(function(m){
    var self=me.id===m.id;
    var nameIn=h('input',{id:'mg-n-'+m.id,type:'text',cls:'mg-in','aria-label':'名字'});nameIn.value=m.name;
    var pwIn=h('input',{id:'mg-p-'+m.id,type:'password',cls:'mg-in',placeholder:'輸入新密碼',autocomplete:'new-password','aria-label':'新密碼'});
    var upd=function(){
      var body={action:'member',member:m.id},n=nameIn.value.trim(),p=pwIn.value;
      if(n&&n!==m.name)body.name=n;
      if(p){if(p.length<4){msg=ERR.pw_short;msgErr=true;bar();return;}body.newPassword=p;}
      if(!body.name&&!body.newPassword){msg='沒有要更新的內容';msgErr=false;bar();return;}
      mgSend(body,(body.newPassword?m.name+' 的密碼已重設':'名字已更新'),function(){if(body.newPassword&&self&&login)setLogin({id:login.id,pw:p});});
    };
    box.appendChild(h('div',{cls:'mg-row'},[
      h('div',{cls:'mg-name'},[nameIn,self?h('span',{cls:'chip',text:'我'}):null]),
      h('label',{cls:'mg-ck'},[h('input',{type:'checkbox',id:'mg-v-'+m.id,checked:(m.viewAll||m.admin)||null,disabled:(m.admin||mgBusy)||null,onchange:function(e){mgSend({action:'member',member:m.id,viewAll:e.target.checked},e.target.checked?m.name+' 可以看所有人的週報了':m.name+' 只能看自己的週報了');}}),h('span',{cls:'mg-lab',text:'可看全部'})]),
      h('label',{cls:'mg-ck'},[h('input',{type:'checkbox',id:'mg-a-'+m.id,checked:m.admin||null,disabled:(self||mgBusy)||null,title:self?'不能取消自己的管理者權限':null,onchange:function(e){mgSend({action:'member',member:m.id,admin:e.target.checked},e.target.checked?m.name+' 現在是管理者':m.name+' 已取消管理者');}}),h('span',{cls:'mg-lab',text:'管理者'})]),
      h('div',{cls:'mg-pw'},[pwIn]),
      h('div',{cls:'mg-act'},[h('button',{cls:'btn',id:'mg-u-'+m.id,disabled:mgBusy||null,onclick:upd,text:'更新'}),
        self?null:h('button',{cls:'btn ghost danger',id:'mg-d-'+m.id,disabled:mgBusy||null,onclick:function(){
          if(mgDel!==m.id){mgDel=m.id;render();return;}
          mgSend({action:'member',member:m.id,remove:true},'已刪除 '+m.name,function(){mgDel=null;});
        },text:mgDel===m.id?'確定刪除？':'刪除'})])]));
  });
  sec.appendChild(box);
  var addName=h('input',{id:'mg-new-name',type:'text',cls:'mg-in',placeholder:'名字'});
  var addPw=h('input',{id:'mg-new-pw',type:'text',cls:'mg-in',placeholder:'密碼（至少 4 個字）',autocomplete:'off'});
  var addVa=h('input',{type:'checkbox',id:'mg-new-va'});
  var addIt=function(){
    var n=addName.value.trim(),p=addPw.value;
    if(!n){msg=ERR.name_empty;msgErr=true;bar();return;}
    if(p.length<4){msg=ERR.pw_short;msgErr=true;bar();return;}
    mgSend({action:'add',name:n,newPassword:p,viewAll:addVa.checked},'已新增 '+n+'，請把名字和密碼告訴他');
  };
  sec.appendChild(h('div',{cls:'panel'},[h('h3',{text:'新增成員'}),
    h('p',{text:'幫同事建立帳號，再把名字和密碼告訴他。同事也可以自己在登入畫面按「新增我的分頁」註冊。'}),
    h('div',{cls:'row'},[addName,addPw,h('label',{cls:'check'},[addVa,h('span',{text:'可看全部'})]),
      h('button',{cls:'btn primary',id:'mg-add',disabled:mgBusy||null,onclick:addIt,text:'新增'})])]));
  sec.appendChild(h('p',{cls:'meta',text:'「可看全部」：可以看所有人的週報，但只能改自己的。「管理者」：可以看、改所有人的週報，也能管理成員。'}));
  wrap.appendChild(sec);
}

// ---------- 儲存 ----------
var barEl=null;
function bar(){
  var d=dirty(),show=d||msg||reauth;
  if(!show){if(barEl){barEl.remove();barEl=null;}return;}
  if(barEl)barEl.remove();
  var right;
  if(reauth){
    var go2=function(){var v=val('re-pw');if(!v)return;setLogin({id:login?login.id:(me&&me.id),pw:v});reauth=false;save();};
    right=h('div',{cls:'toolbar'},[h('input',{id:'re-pw',type:'password',cls:'pwin',placeholder:'輸入你的密碼',onkeydown:function(e){if(e.key==='Enter')go2();}}),
      h('button',{cls:'btn primary',id:'re-ok',onclick:go2,text:'確認並儲存'})]);
  }else if(d){
    right=h('div',{cls:'toolbar'},[
      h('button',{cls:'btn ghost',id:'discard',disabled:busy||null,onclick:discard,text:'捨棄變更'}),
      h('button',{cls:'btn primary',id:'save',disabled:busy||null,onclick:save,text:busy?'儲存中…':'儲存並更新'})]);
  }else right=h('button',{cls:'x',onclick:function(){msg='';bar();},'aria-label':'關閉',text:'×'});
  barEl=h('div',{cls:'savebar',role:'status'},[h('div',{cls:'in'},[
    h('span',{cls:'msg'+(msgErr||reauth?' err':''),text:reauth?'登入已失效，請重新輸入密碼，剛改的內容會一起儲存。':(msg||(d?'有尚未儲存的變更，儲存後打開網址就會看到最新內容。':''))}),right])]);
  document.body.appendChild(barEl);
  if(reauth)setTimeout(function(){var el=document.getElementById('re-pw');if(el)el.focus();},0);
}
function discard(){
  var mid=view;data[mid].weeks=[];
  Object.keys(snap).forEach(function(k){if(k.indexOf(mid+'|')===0)data[mid].weeks.push(JSON.parse(snap[k]));});
  msg='';reauth=false;confirmDel=false;render();
}
function clean(mid){
  weeksOf(mid).forEach(function(w){
    w.goals=w.goals.filter(function(g){return (g.text||'').trim()||(g.note||'').trim();});
    DAYS.forEach(function(d){w.days[d[0]]=(w.days[d[0]]||[]).filter(function(t){return (t.text||'').trim();});});
  });
}
function save(){
  if(busy)return;
  var mid=view;clean(mid);
  var ch=changesOf(mid);if(!ch.length){render();return;}
  busy=true;msg='儲存中…';msgErr=false;bar();
  api(Object.assign({action:'save',member:mid,changes:ch},auth()),function(res){
    busy=false;
    if(res.denied){
      if(res.reason==='not_yours'){msg='你只能修改自己的週報。';msgErr=true;editing=false;discard();return;}
      reauth=true;msg='';render();return;
    }
    if(res.error){msg='儲存失敗（'+res.error+'），請重新整理頁面。';msgErr=true;render();return;}
    load(res);
    if(res.ok!==false){msg='已儲存';msgErr=false;setTimeout(function(){if(msg==='已儲存'){msg='';bar();}},2500);}
    else{msg='這週剛剛在別的地方被改過，已載入最新內容，請再改一次。';msgErr=true;}
    render();
  },function(){busy=false;msg='儲存失敗，請檢查網路後再按一次「儲存並更新」。';msgErr=true;render();});
}
window.addEventListener('resize',function(){app.querySelectorAll('textarea.grow').forEach(grow);});
window.addEventListener('beforeunload',function(e){if(dirty()&&!busy){e.preventDefault();e.returnValue='';}});

render();
refresh(true);
setInterval(function(){if(!document.hidden&&screen==='app')refresh(false);},60000);
})();
</script>
